<svg xmlns="http://www.w3.org/2000/svg"
     width="50"
     height="50"
     viewBox="0 0 50 50"
     shape-rendering="crispEdges">

    <!-- 3x3 Grid -->
    <rect x="1"  y="1"  width="14" height="14" fill="#FFE8E8"/>
    <rect x="18" y="1"  width="14" height="14" fill="#FF2B2B"/>
    <rect x="35" y="1"  width="14" height="14" fill="#6D0000"/>

    <rect x="1"  y="18" width="14" height="14" fill="#C00000"/>
    <rect x="18" y="18" width="14" height="14" fill="#FFC3C3"/>
    <rect x="35" y="18" width="14" height="14" fill="#D92A3A"/>

    <rect x="1"  y="35" width="14" height="14" fill="#8A0000"/>
    <rect x="18" y="35" width="14" height="14" fill="#FF7B86"/>
    <rect x="35" y="35" width="14" height="14" fill="#FF0F0F"/>

</svg>
